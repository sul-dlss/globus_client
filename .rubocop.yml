inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  DisplayCopNames: true
  SuggestExtensions: false
  NewCops: disable
  Exclude:
    - bin/**
    - vendor/bundle/**/*

# Development uses Ruby 4, but the gem still supports Ruby 3.1 consumers.
Gemspec/RequiredRubyVersion:
  Exclude:
    - globus_client.gemspec

# Per team developer playbook
RSpec/MultipleMemoizedHelpers:
  Enabled: false

# Layout
Layout/LineLength:
  Max: 150

# Naming
Naming/PredicatePrefix:
  ForbiddenPrefixes:
    - is_
    - have_
